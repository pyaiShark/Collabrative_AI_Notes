<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="8" fill="#111111"/>

  <!-- Orange glow circle -->
  <circle cx="16" cy="16" r="10" fill="#f97316" opacity="0.15"/>

  <!-- Brain circuit icon paths (simplified BrainCircuit from lucide) -->
  <!-- Left brain lobe -->
  <path d="M13 10 C10 10 8 12 8 14.5 C8 16 8.8 17.2 10 18 C9.5 18.5 9 19.5 9 20.5 C9 22 10.2 23 11.5 23 C12 23 12.5 22.8 13 22.5" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Right brain lobe -->
  <path d="M19 10 C22 10 24 12 24 14.5 C24 16 23.2 17.2 22 18 C22.5 18.5 23 19.5 23 20.5 C23 22 21.8 23 20.5 23 C20 23 19.5 22.8 19 22.5" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Center divider -->
  <line x1="16" y1="10" x2="16" y2="23" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Circuit dots -->
  <circle cx="16" cy="13" r="1" fill="#f97316"/>
  <circle cx="16" cy="17" r="1" fill="#f97316"/>
  <circle cx="16" cy="21" r="1" fill="#f97316"/>
  <!-- Horizontal circuit lines -->
  <line x1="16" y1="13" x2="19" y2="13" stroke="#f97316" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13" y1="17" x2="16" y2="17" stroke="#f97316" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="19" y2="21" stroke="#f97316" stroke-width="1.2" stroke-linecap="round"/>
</svg>
